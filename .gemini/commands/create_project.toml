description = "プロジェクトを作成する"
prompt = """
１つ目に指定された文字列をプロジェクト名とする。
- programs/TEMPLATE (以下テンプレート) をもとにして、引数で指定されたプロジェクト名のフォルダを作成する 。
- テンプレート内の、シェルスクリプトをすべてコピーする。
- run.sh内の以下の場所**だけ**修正すること。
  - 入出力ファイルの指定(ITFなど)は該当するプロジェクト名のプログラム設計書をdocs内から探して読み込み、その内容にしたがって設定すること。
- 内容が空のプロエクト名.COBファイルを作成する。
- テンプレート内の CHECKLIST.md をもとに、プログラム設計書の内容参照してチェック項目を作成する。
"""
